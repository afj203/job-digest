name: Daily Job Digest

on:
  #schedule:
  #  - cron: "0 10 * * *"   # 6:00 AM ET
 #   - cron: "0 16 * * *"   # 12:00 PM ET
 #   - cron: "0 22 * * *"   # 6:00 PM ET
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest
        env:
          BRAVE_API_KEY:      ${{ secrets.BRAVE_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python job_digest.py

      - name: Upload digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest.html
          retention-days: 7

      - name: Commit updated files back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json all_jobs.json all_jobs.html
          git diff --staged --quiet || git commit -m "chore: update job data [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/afj203/job-digest.git
