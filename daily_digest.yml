name: Daily Job Digest

on:
  schedule:
    # All times UTC — adjusted for US Eastern Daylight Time (ET = UTC-4)
    - cron: "0 10 * * *"   # 6:00 AM ET
    - cron: "0 16 * * *"   # 12:00 PM ET
    - cron: "0 22 * * *"   # 6:00 PM ET
  workflow_dispatch:        # lets you trigger manually from GitHub anytime

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX:      ${{ secrets.GOOGLE_CX }}
        run: python job_digest.py

      - name: Upload digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest.html
          retention-days: 7

      - name: Commit updated files back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json all_jobs.json all_jobs.html
          git diff --staged --quiet || git commit -m "chore: update job data [skip ci]"
          git push
